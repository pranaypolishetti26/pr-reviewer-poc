version: 0.2

env:
  secrets-manager:
    KIRO_API_KEY: "poc/kiro-pr-reviewer:KIRO_API_KEY"
    GITHUB_PERSONAL_ACCESS_TOKEN: "poc/kiro-pr-reviewer:GITHUB_PERSONAL_ACCESS_TOKEN"

phases:
  install:
    commands:
      - curl -fsSL https://cli.kiro.dev/install | bash
      - export PATH="$HOME/.local/bin:$PATH"
      - kiro-cli --version
      - mkdir -p "$HOME/.kiro/agents" "$HOME/.kiro/settings"
      - cp .kiro/agents/pr-reviewer-prompt.md "$HOME/.kiro/agents/pr-reviewer-prompt.md"
      - cp .kiro/settings/mcp.json "$HOME/.kiro/settings/mcp.json"

  pre_build:
    commands:
      - |
        case "$CODEBUILD_WEBHOOK_TRIGGER" in
          pr/*) echo "Pull request webhook detected: $CODEBUILD_WEBHOOK_TRIGGER" ;;
          *) echo "This build was not triggered by a PR webhook"; exit 1 ;;
        esac

  build:
    commands:
      - |
        PR_NUMBER="${CODEBUILD_WEBHOOK_TRIGGER#pr/}"

        PROMPT="Review pull request ${PR_NUMBER} in ${GITHUB_REPOSITORY}.
        Read the pull request changes and the linked GitHub issue using the GitHub MCP server.
        Retrieve the relevant architecture, requirements, and testing rules using the project-knowledge MCP server.
        Review only against evidence from the pull request, linked issue, and project knowledge.
        Post one concise review to the pull request and clearly identify blocking issues."

        kiro-cli chat \
          --agent pr-reviewer \
          --no-interactive \
          --require-mcp-startup \
          --trust-all-tools \
          "$PROMPT"
